name: 'Quorum - AI Code Review'
description: 'AI-powered code review using AWS Bedrock with configurable depth and security-focused analysis'
author: 'Ezequiel Godoy'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  aws-region:
    description: 'AWS region for Bedrock (auto-detected from AWS_REGION env var if not specified)'
    required: false

  model:
    description: 'Bedrock model ID to use for code review'
    required: false
    default: 'anthropic.claude-sonnet-4-20250514-v1:0'

  config-path:
    description: 'Path to .quorum.yaml configuration file'
    required: false
    default: '.quorum.yaml'

  github-token:
    description: 'GitHub token for API access (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}

  review-depth:
    description: 'Review depth profile: quick, standard, deep, or security'
    required: false
    default: 'standard'

  fail-on-errors:
    description: 'Fail the action if critical issues are found'
    required: false
    default: 'false'

  dry-run:
    description: 'Run without posting comments (logs instead)'
    required: false
    default: 'false'

outputs:
  review-summary:
    description: 'Summary of the code review results'

  issues-found:
    description: 'Number of issues found during review'

  cost-usd:
    description: 'Estimated cost of the review in USD'

runs:
  using: 'node20'
  main: 'dist/index.js'
